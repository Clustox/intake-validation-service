# Local MariaDB 11.4 for development and verification.
# Optional: any MariaDB 11.4 server reachable via the DB_* variables works.
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ivs-mariadb:/var/lib/mysql
volumes:
  ivs-mariadb:
